# Stack de PRODUCTION — distincte de docker-compose.yml (développement).
#
# Usage (première mise en ligne sur un serveur, dans cet ordre) :
#   cp .env.prod.example .env.prod
#   cp backend/.env.prod.example backend/.env.prod
#   # remplir les deux fichiers avec les vraies valeurs de déploiement (dont DOMAIN)
#   ./infra/scripts/init-letsencrypt.sh <domaine> <email>   # UNE SEULE FOIS — bootstrap TLS
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# nginx est désormais le SEUL service exposé sur l'hôte (80/443) — backend,
# frontend et geoserver ne sont plus atteignables que via le réseau Docker
# interne "eecnet", à travers le reverse proxy.
#
# Sauvegardes (INFRA-4) : dump automatique chaque nuit (service "backup"),
# stocké dans ./backups/postgres/ sur l'hôte — voir infra/backup/ pour la
# configuration et infra/scripts/restore-postgres.sh pour restaurer. Copie
# hors-site pas encore branchée (à faire via infra/backup/offsite-hook.sh
# dès qu'une destination sera choisie).
#
# Journalisation (INFRA-5) : logs Django avec rotation dans ./logs/backend/
# sur l'hôte (survit à la recréation du conteneur, voir settings/prod.py) ;
# tous les conteneurs ont en plus une rotation des logs Docker eux-mêmes
# (x-logging ci-dessous) — sans ça, "docker logs" grossit indéfiniment.

# Nom de projet EXPLICITE et distinct de docker-compose.yml (dev). Sans ça,
# Compose dérive le nom du projet du dossier ("geoeec") pour LES DEUX
# fichiers, et comme ils déclarent les mêmes noms de service (db, backend,
# frontend, geoserver, redis), Compose les confond : un "up" sur ce fichier
# peut alors arrêter/recréer les conteneurs dev correspondants (vécu et
# corrigé lors de la vérification de l'INFRA-2 — les conteneurs dev ont dû
# être relancés manuellement). Ce nom rend ça impossible.
name: geoeec-prod

# Rotation des logs Docker (stdout/stderr de chaque conteneur) — le pilote
# "json-file" par défaut n'a AUCUNE limite de taille sans ça, et finit par
# remplir le disque. 10 Mo x 5 fichiers = 50 Mo max par conteneur.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: eec_db_prod
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pg_data_prod:/var/lib/postgresql/data
    # Pas de port publié : seul le réseau interne Docker y accède.
    networks: [eecnet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  geoserver:
    image: docker.osgeo.org/geoserver:2.26.2
    container_name: eec_geoserver_prod
    # DÉSACTIVÉ PAR DÉFAUT (profil Compose) — audit du 28/08/2026.
    #
    # L'instance ne contenait QUE les données de démonstration livrées avec
    # l'image (tiger, nurc, sf, topp, ne…) : aucun workspace « eec », aucune
    # couche publiée, et les styles SLD de infra/geoserver/styles/ n'ont jamais
    # été chargés. Côté application, NEXT_PUBLIC_GEOSERVER_URL n'est lue par
    # aucune ligne de code : la carte consomme le GeoJSON de l'API DRF.
    # Coût constaté : ~1 Go de RAM et 979 Mo d'image pour zéro requête servie.
    #
    # Le service reste DÉCLARÉ (montée en charge future, publication OGC), mais
    # n'est plus démarré automatiquement. Pour le relancer ponctuellement :
    #     docker compose --profile geoserver up -d geoserver
    #
    # ATTENTION si tu le réactives : les blocs location /geoserver/ ont été
    # retirés des templates nginx, car un proxy_pass vers un conteneur absent
    # empêche nginx de démarrer (« host not found in upstream ») — ce qui
    # ferait tomber TOUT le site, pas seulement GeoServer.
    profiles: ["geoserver"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      GEOSERVER_ADMIN_USER: admin
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD}
      PROXY_BASE_URL: ${NEXT_PUBLIC_GEOSERVER_URL}
      EXTRA_JAVA_OPTS: "-Xms512m -Xmx1g -XX:+UseG1GC"
      INSTALL_EXTENSIONS: "true"
      STABLE_EXTENSIONS: "css,vectortiles"
    volumes:
      - geoserver_data_prod:/opt/geoserver_data
    # Pas de port publié — seul nginx y accède (et bloque /geoserver/web,
    # voir infra/nginx/templates/geoeec.conf.template, INFRA-7).
    depends_on:
      db:
        condition: service_healthy
    networks: [eecnet]
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/geoserver/rest/about/version.json | grep -q '200\\|401'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: eec_redis_prod
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - redis_data_prod:/data
    networks: [eecnet]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backup:
    build:
      context: ./infra/backup
    container_name: eec_backup_prod
    restart: unless-stopped
    logging: *default-logging
    environment:
      - PGHOST=db
      - PGPORT=5432
      - PGDATABASE=${DB_NAME}
      - PGUSER=${DB_USER}
      - PGPASSWORD=${DB_PASSWORD}
      - BACKUP_SCHEDULE=${BACKUP_SCHEDULE:-0 3 * * *}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-14}
    volumes:
      # Bind-mount HOST (pas un volume Docker nommé) — survit à un
      # "docker compose down -v" et reste accessible à un outil externe
      # (rclone/rsync/cron hôte) sans passer par Docker. Voir INFRA-4 :
      # copie hors-site toujours à brancher via infra/backup/offsite-hook.sh.
      - ./backups/postgres:/backups
    depends_on:
      db:
        condition: service_healthy
    networks: [eecnet]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eec_backend_prod
    restart: unless-stopped
    logging: *default-logging
    # Pas de "command:" — utilise le CMD de production du Dockerfile
    # (migrate + collectstatic + gunicorn). Pas de bind-mount du code source
    # non plus : l'image construite est immuable, contrairement au dev.
    env_file:
      - ./backend/.env.prod
    environment:
      - LOG_DIR=/app/logs
    volumes:
      # Logs Django avec rotation (INFRA-5) — persistés hors du conteneur.
      - ./logs/backend:/app/logs
      - media_data_prod:/app/media
    # Pas de port publié — seul nginx y accède.
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [eecnet]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      # ARGs de build : Next.js les inline dans le bundle client au moment
      # du "npm run build" — les redéfinir ici nécessite de reconstruire
      # l'image (docker compose ... up --build), pas juste un restart.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_GEOSERVER_URL: ${NEXT_PUBLIC_GEOSERVER_URL}
    container_name: eec_frontend_prod
    restart: unless-stopped
    logging: *default-logging
    environment:
      # Lu côté serveur Next.js à chaque requête (rewrites) — celui-ci peut
      # rester une variable d'environnement runtime classique.
      - BACKEND_INTERNAL_URL=http://backend:8000
      - NEXT_TELEMETRY_DISABLED=1
    # Pas de port publié — seul nginx y accède.
    depends_on:
      - backend
    networks: [eecnet]

  nginx:
    image: nginx:1.27-alpine
    container_name: eec_nginx_prod
    restart: unless-stopped
    logging: *default-logging
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./infra/nginx/templates:/etc/nginx/templates:ro
      # Neutralise le default.conf livré par l'image (conflit constaté avec
      # geoeec.conf sinon — voir infra/nginx/empty.conf).
      - ./infra/nginx/empty.conf:/etc/nginx/conf.d/default.conf:ro
      - letsencrypt_certs:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
      - media_data_prod:/app/media:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    networks: [eecnet]

  certbot:
    image: certbot/certbot:latest
    container_name: eec_certbot_prod
    logging: *default-logging
    volumes:
      - letsencrypt_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    # Renouvelle automatiquement toutes les 12h (certbot ignore les
    # certificats non encore éligibles au renouvellement — sans risque de
    # sur-solliciter Let's Encrypt). L'obtention initiale se fait via
    # infra/scripts/init-letsencrypt.sh, pas ici.
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    networks: [eecnet]

volumes:
  pg_data_prod:
  geoserver_data_prod:
  redis_data_prod:
  letsencrypt_certs:
  certbot_webroot:
  media_data_prod:

networks:
  eecnet:
    # Nom explicite : sans ça, Compose nomme le réseau d'après le dossier
    # ("geoeec_eecnet"), identique à celui de docker-compose.yml (dev) — les
    # deux stacks partageraient alors le même réseau si elles tournaient en
    # même temps depuis le même dossier, avec un alias DNS "backend" ambigu
    # entre les deux conteneurs.
    name: geoeec_prod_eecnet
    driver: bridge
