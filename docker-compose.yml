services:
  db:
    image: postgis/postgis:16-3.4
    container_name: eec_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      # Port hôte 5435 pour éviter le conflit avec PostgreSQL local (127.0.0.1:5432)
      # Le backend Django communique en interne via db:5432 (réseau Docker)
      - "5435:5432"
    networks: [eecnet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  geoserver:
    image: docker.osgeo.org/geoserver:2.26.2
    container_name: eec_geoserver_dev
    # DÉSACTIVÉ PAR DÉFAUT (profil Compose) — audit du 28/08/2026.
    #
    # L'instance ne contenait QUE les données de démonstration livrées avec
    # l'image (tiger, nurc, sf, topp, ne…) : aucun workspace « eec », aucune
    # couche publiée, et les styles SLD de infra/geoserver/styles/ n'ont jamais
    # été chargés. Côté application, NEXT_PUBLIC_GEOSERVER_URL n'est lue par
    # aucune ligne de code : la carte consomme le GeoJSON de l'API DRF.
    # Coût constaté : ~1 Go de RAM et 979 Mo d'image pour zéro requête servie.
    #
    # Le service reste DÉCLARÉ (montée en charge future, publication OGC), mais
    # n'est plus démarré automatiquement. Pour le relancer ponctuellement :
    #     docker compose --profile geoserver up -d geoserver
    #
    # ATTENTION si tu le réactives : les blocs location /geoserver/ ont été
    # retirés des templates nginx, car un proxy_pass vers un conteneur absent
    # empêche nginx de démarrer (« host not found in upstream ») — ce qui
    # ferait tomber TOUT le site, pas seulement GeoServer.
    profiles: ["geoserver"]
    restart: unless-stopped
    environment:
      GEOSERVER_ADMIN_USER: admin
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD}
      PROXY_BASE_URL: http://localhost:8080/geoserver
      EXTRA_JAVA_OPTS: "-Xms512m -Xmx1g -XX:+UseG1GC"
      INSTALL_EXTENSIONS: "true"
      STABLE_EXTENSIONS: "css,vectortiles"
    volumes:
      - geoserver_data:/opt/geoserver_data
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks: [eecnet]
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/geoserver/rest/about/version.json | grep -q '200\\|401'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: eec_redis_dev
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks: [eecnet]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eec_backend_dev
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
      # Fichiers sources Excel/DOCX des commandes d'import (import_paroisses,
      # import_statistiques, import_ouvriers, import_oeuvres). Ces commandes
      # cherchent /data par défaut : sans ce montage elles échouent sur le
      # chemin. En lecture seule — un import ne modifie jamais la source.
      - ./data:/data:ro
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [eecnet]

  # ─────────────────────────────────────────────────────────────────────────────
  # Frontend : NE PAS démarrer avec "docker compose up" sans spécifier les services.
  # En développement local, lancer avec : cd frontend && npm run dev
  # Ce service est réservé au déploiement / CI uniquement.
  # Commande manuelle si besoin : docker compose up frontend
  # ─────────────────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eec_frontend_dev
    profiles:
      - deploy
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - next_cache:/app/.next
    ports:
      - "3004:3004"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
      - NEXT_PUBLIC_GEOSERVER_URL=http://localhost:8080/geoserver
      - BACKEND_INTERNAL_URL=http://backend:8000
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      - backend
    networks: [eecnet]

volumes:
  pg_data:
  geoserver_data:
  redis_data:
  next_cache:

networks:
  eecnet:
    driver: bridge
