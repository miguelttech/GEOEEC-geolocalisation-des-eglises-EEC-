<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>EEC Cameroun · Console synodale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Inter:wght@300;400;450;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="STYLESHEETS/styles.css"/>
  <link rel="stylesheet" href="STYLESHEETS/dashboard.css"/>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script src="SCRIPTS/data.js"></script>
  <script type="text/babel" src="COMPONENTS/dash-core.jsx"></script>
  <script type="text/babel" src="COMPONENTS/dash-widgets.jsx"></script>
  <script type="text/babel">
    const { Sidebar, Topbar, KPIs, QuickActions } = window.DashboardCore;
    const { GrowthChart, OeuvresDonut, ActivityFeed, MiniMap, RegionsTable } = window.DashWidgets;

    function DashboardApp() {
      return (
        <div className="app-shell">
          <Sidebar/>
          <main className="main">
            <Topbar/>
            <div className="content">
              <div className="page-head">
                <div>
                  <div style={{fontFamily:'var(--mono)', fontSize:'11px', letterSpacing:'0.2em', color:'var(--eec-gold)'}}>— TABLEAU DE BORD · MAI 2026</div>
                  <h1>Bonsoir, <em>Pasteur Joël.</em></h1>
                  <div className="sub">Aperçu général de l'Église Évangélique du Cameroun — 546 paroisses, 22 régions synodales, 708 ouvriers.</div>
                </div>
                <div className="actions">
                  <a href="index.html" className="btn btn-ghost">← Retour au site public</a>
                  <a href="#" className="btn btn-gold">+ Nouvelle paroisse</a>
                </div>
              </div>

              <KPIs/>
              <QuickActions/>

              <div className="dash-grid">
                <div className="card">
                  <GrowthChart/>
                </div>
                <div style={{display:'flex', flexDirection:'column', gap:'24px'}}>
                  <MiniMap/>
                  <div className="card">
                    <OeuvresDonut/>
                  </div>
                </div>
              </div>

              <div className="dash-grid" style={{gridTemplateColumns: '1.6fr 1fr'}}>
                <div className="card">
                  <RegionsTable/>
                </div>
                <div className="card">
                  <ActivityFeed/>
                </div>
              </div>
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<DashboardApp/>);
  </script>
</body>
</html>
