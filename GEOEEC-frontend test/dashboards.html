<style>
/* Level switcher tabs at top */
.level-bar {
  display: flex; align-items: center; gap: 2px;
  padding: 6px;
  background: rgba(255,255,255,0.02);
  border-radius: 8px;
  border: 1px solid var(--eec-line);
}
.level-tab {
  padding: 8px 18px;
  border-radius: 6px;
  font: 500 13px var(--sans);
  color: var(--eec-text-mute);
  cursor: pointer;
  transition: all 0.2s;
  border: 0; background: transparent;
  display: flex; align-items: center; gap: 8px;
}
.level-tab:hover { color: var(--eec-text); background: rgba(245,197,24,0.04); }
.level-tab.active {
  background: var(--eec-gold);
  color: var(--eec-green-deep);
  font-weight: 600;
}
.level-tab .dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: currentColor;
}

/* Region selector */
.region-selector {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 16px;
  background: rgba(255,255,255,0.025);
  border: 1px solid var(--eec-line);
  border-radius: 6px;
  font-size: 14px; font-weight: 500;
  color: white; cursor: pointer;
  transition: all 0.2s;
}
.region-selector:hover { border-color: rgba(245,197,24,0.4); }
.region-selector svg { color: var(--eec-gold); }
.region-selector .caret { margin-left: 4px; color: var(--eec-text-mute); }

/* Breadcrumb trail */
.trail {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--mono); font-size: 11px;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--eec-text-mute);
  padding: 14px 36px;
  border-bottom: 1px solid var(--eec-line);
  background: rgba(13,27,18,0.5);
}
.trail .sep { color: var(--eec-line); }
.trail .active { color: var(--eec-gold); font-weight: 500; }
.trail a { color: var(--eec-text-mute); cursor: pointer; text-decoration: none; transition: color 0.15s; }
.trail a:hover { color: var(--eec-text); }

/* KPI mini (smaller for sub-dashboards) */
.kpi-mini-row {
  display: grid; grid-template-columns: repeat(5, 1fr);
  gap: 1px; background: var(--eec-line);
  border: 1px solid var(--eec-line);
  border-radius: 8px; overflow: hidden;
  margin-bottom: 28px;
}
.kpi-mini {
  background: linear-gradient(180deg, #0F1F16, #0A1610);
  padding: 18px 20px;
  transition: background 0.2s;
}
.kpi-mini:hover { background: #112218; }
.kpi-mini .lbl {
  font-family: var(--mono); font-size: 9.5px;
  letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--eec-text-mute); margin-bottom: 8px;
}
.kpi-mini .val {
  font-family: var(--serif); font-size: 34px;
  font-weight: 300; line-height: 1;
  letter-spacing: -0.02em; color: white;
}
.kpi-mini .delta {
  margin-top: 8px; font-family: var(--mono);
  font-size: 10px; color: #6FCB95;
  letter-spacing: 0.06em;
}

/* 3-col grid for sub-dash */
.sub-grid {
  display: grid;
  grid-template-columns: 1.4fr 1fr 1fr;
  gap: 20px;
  margin-bottom: 24px;
}
.sub-grid-2 {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 20px; margin-bottom: 24px;
}

/* District list inside region dash */
.district-rows { }
.district-row {
  display: grid;
  grid-template-columns: 12px 1fr 60px 80px 100px auto;
  gap: 18px; padding: 14px 24px;
  border-bottom: 1px solid rgba(245,197,24,0.05);
  align-items: center; cursor: pointer;
  transition: background 0.15s;
  font-size: 13px;
}
.district-row:hover { background: rgba(245,197,24,0.03); }
.district-row:last-child { border-bottom: 0; }
.district-row .dl-name { font-weight: 500; color: white; }
.district-row .dl-name small { display: block; font-family: var(--mono); font-size: 10px; color: var(--eec-text-mute); margin-top: 2px; letter-spacing: 0.1em; text-transform: uppercase; }
.district-row .dl-num { font-family: var(--serif); font-size: 20px; color: white; font-weight: 400; }
.district-row .dl-bar { height: 5px; background: rgba(255,255,255,0.06); border-radius: 3px; overflow: hidden; }
.district-row .dl-bar span { display: block; height: 100%; background: linear-gradient(90deg, var(--eec-light), var(--eec-gold)); border-radius: 3px; }

/* Radar chart (CSS) */
.radar-wrap { padding: 12px 24px 24px; }

/* Progress rings */
.ring-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 18px 24px; }
.ring-item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.ring-item svg { transform: rotate(-90deg); }
.ring-item .r-val { font-family: var(--serif); font-size: 22px; font-weight: 300; color: white; }
.ring-item .r-lbl { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--eec-text-mute); text-align: center; }

/* Parish sub-dashboard specific */
.parish-sub-header {
  background:
    linear-gradient(135deg, rgba(27,107,53,0.3), rgba(245,197,24,0.06)),
    #0A1610;
  border: 1px solid var(--eec-line);
  border-radius: 8px;
  padding: 24px 28px;
  margin-bottom: 24px;
  display: grid; grid-template-columns: 1fr auto;
  gap: 40px; align-items: center;
}
.parish-sub-header h2 {
  font-family: var(--serif); font-weight: 400; font-size: 28px;

}
.parish-sub-header h2 em { color: var(--eec-gold); font-style: italic; }
.parish-sub-header .tags { display: flex; gap: 8px; margin-top: 10px; }

<script type="text/babel">
const { useState, useEffect, useRef } = React;
const { Sidebar, Topbar, Logo, I, Counter, Sparkline } = window.DashboardCore;
const data = window.EEC_DATA;

// Animated ring
function Ring({ value, max, color, r = 32, stroke = 5 }) {
  const circ = 2 * Math.PI * r;
  const dash = (value / max) * circ;
  return (
    <svg width={r*2+stroke*2} height={r*2+stroke*2} viewBox={`0 0 ${r*2+stroke*2} ${r*2+stroke*2}`}>
      <circle cx={r+stroke} cy={r+stroke} r={r} fill="none" stroke="rgba(245,197,24,0.08)" strokeWidth={stroke}/>
      <circle cx={r+stroke} cy={r+stroke} r={r} fill="none" stroke={color} strokeWidth={stroke}
              strokeDasharray={`${dash} ${circ}`} strokeLinecap="round"/>
    </svg>
  );
}

// Level switcher
function LevelBar({ level, setLevel }) {
  const levels = [
    { id: 'region', label: 'Régional', color: '#F5C518' },
    { id: 'district', label: 'District', color: '#2D9E55' },
    { id: 'paroisse', label: 'Paroissial', color: '#7FCB95' },
  ];
  return (
    <div style={{ display: 'flex', gap: '12px', alignItems: 'center', marginBottom: '28px', flexWrap: 'wrap' }}>
      <div className="level-bar">
        {levels.map(l => (
          <button key={l.id} className={`level-tab ${level === l.id ? 'active' : ''}`}
                  onClick={() => setLevel(l.id)}
                  style={level !== l.id ? {} : {background: l.color}}>
            <span className="dot" style={level !== l.id ? {background: l.color} : {}}></span>
            {l.label}
          </button>
        ))}
      </div>
      <button className="region-selector">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        {level === 'region' ? 'MIFI' : level === 'district' ? 'Bafoussam I' : 'Bafang Centre'}
        <svg className="caret" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m6 9 6 6 6-6"/></svg>
      </button>
    </div>
  );
}

        </div>
        <div style={{textAlign:'right'}}>
          <div style={{fontFamily:'var(--mono)',fontSize:'10px',letterSpacing:'0.15em',color:'var(--eec-text-mute)',marginBottom:'4px'}}>RESPONSABLE</div>
          <div style={{fontFamily:'var(--serif)',fontSize:'18px',fontWeight:500}}>Pasteur WAMBA Samuel</div>
          <div style={{fontFamily:'var(--mono)',fontSize:'10px',color:'#7FCB95',letterSpacing:'0.14em',marginTop:'4px'}}>EN POSTE DEPUIS 2018</div>
        </div>
      </div>

      <div className="kpi-mini-row" style={{gridTemplateColumns:'repeat(4,1fr)'}}>
        {[
          {lbl:'Fidèles',val:1240},{lbl:'Ouvriers',val:14},{lbl:'Œuvres',val:3},{lbl:'Complétion',val:'94%'},
        ].map((k,i)=>(
          <div className="kpi-mini" key={i}>
            <div className="lbl">{k.lbl}</div>
            <div className="val">{typeof k.val==='number'?<Counter to={k.val}/>:k.val}</div>
          </div>
        ))}
      </div>

      <div className="sub-grid-2">
        <div className="card">
          <div className="card-head"><h3>Membres & ouvriers</h3><a href="paroisse.html" style={{fontFamily:'var(--mono)',fontSize:'11px',color:'var(--eec-gold)',textDecoration:'none',letterSpacing:'0.1em'}}>VOIR FICHE →</a></div>
          <div style={{padding:'18px 24px'}}>
            {[
              {ini:'WS',bg:'linear-gradient(135deg,#F5C518,#C99A0E)',c:'#0D1B12',n:'Pasteur WAMBA Samuel',r:'Pasteur Titulaire',since:'2018'},
              {ini:'NN',bg:'linear-gradient(135deg,#2D9E55,#1B6B35)',c:'white',n:'Diacre NGOUFFO Noé',r:'Diacre Principal',since:'2020'},
              {ini:'TM',bg:'linear-gradient(135deg,#3FB36A,#1B6B35)',c:'white',n:'TCHOUMI Marie',r:'Catéchiste',since:'2015'},
              {ini:'FK',bg:'linear-gradient(135deg,#E0A914,#C99A0E)',c:'#0D1B12',n:'FOWE Kévin',r:'Pasteur Stagiaire',since:'2024'},
            ].map((o,i)=>(
              <div key={i} style={{display:'flex',gap:'14px',alignItems:'center',padding:'12px 0',borderBottom:'1px solid rgba(245,197,24,0.05)'}}>
                <div style={{width:36,height:36,borderRadius:'50%',background:o.bg,color:o.c,display:'grid',placeItems:'center',fontFamily:'var(--serif)',fontWeight:600,fontSize:13,flex:'0 0 36px'}}>{o.ini}</div>
                <div style={{flex:1}}>
                  <div style={{fontWeight:500,fontSize:'13.5px',color:'white'}}>{o.n}</div>
                  <div style={{fontFamily:'var(--mono)',fontSize:'10px',letterSpacing:'0.14em',textTransform:'uppercase',color:'var(--eec-gold)',marginTop:2}}>{o.r}</div>
                </div>
                <div style={{fontFamily:'var(--mono)',fontSize:'10px',color:'var(--eec-text-mute)',letterSpacing:'0.06em'}}>DEPUIS {o.since}</div>
              </div>
            ))}
          </div>
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:'20px'}}>
          <div className="card">
            <div className="card-head"><h3>Complétion du profil</h3></div>
            <div className="ring-grid" style={{gridTemplateColumns:'1fr 1fr'}}>
              {[{v:94,c:'#F5C518',l:'Profil global'},{v:100,c:'#2D9E55',l:'GPS vérifié'},{v:87,c:'#6FCB95',l:'Photos'},{v:75,c:'#E0A914',l:'Ouvriers'}].map((r,i)=>(
                <div className="ring-item" key={i}>
                  <div style={{position:'relative'}}>
                    <Ring value={r.v} max={100} color={r.c} r={26} stroke={4}/>
                    <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center'}}>
                      <span style={{fontFamily:'var(--serif)',fontSize:'14px',color:'white'}}>{r.v}%</span>
                    </div>
                  </div>
                  <span className="r-lbl">{r.l}</span>
                </div>
              ))}
            </div>
          </div>
          <div className="card">
            <div className="card-head"><h3>Œuvres</h3></div>
            <div style={{padding:'12px 24px 18px'}}>
              {[{n:'École EEC Bafang',t:'École',s:'green'},{n:'Centre de santé',t:'Médical',s:'gold'},{n:'Terrain 2ha',t:'Terrain',s:'gray'}].map((o,i)=>(
                <div key={i} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 0',borderBottom:'1px solid rgba(245,197,24,0.05)'}}>
                  <div style={{fontWeight:500,fontSize:'13px',color:'white'}}>{o.n}</div>
                  <span className={`tag ${o.s}`}>{o.t}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>
    </>
  );
}

function SubDashApp() {
  const [level, setLevel] = useState('region');
  return (
    <div className="app-shell">
      <Sidebar/>
      <main className="main">
        <Topbar/>
        <div style={{borderBottom:'1px solid var(--eec-line)'}}>
          <div className="trail">
            <a href="dashboard.html">SYNODE GÉNÉRAL</a>
            <span className="sep">/</span>
            <a href="#">{level === 'region' ? 'MIFI' : 'MIFI'}</a>
            {level !== 'region' && <><span className="sep">/</span><a href="#">BAFOUSSAM I</a></>}
            {level === 'paroisse' && <><span className="sep">/</span><span className="active">BAFANG CENTRE</span></>}
          </div>
        </div>
        <div className="content">
          <LevelBar level={level} setLevel={setLevel}/>
          {level === 'region' && <RegionDash/>}
          {level === 'district' && <DistrictDash/>}
          {level === 'paroisse' && <ParoisseDash/>}
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<SubDashApp/>);
</script>
</body>
</html>
