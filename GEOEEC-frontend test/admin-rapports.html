<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>EEC · Rapports & exports</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Inter:wght@300;400;450;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="STYLESHEETS/styles.css"/>
<link rel="stylesheet" href="STYLESHEETS/dashboard.css"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
.report-type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:32px}
.rt-card{background:linear-gradient(180deg,#0F1F16,#0A1610);border:1px solid var(--eec-line);border-radius:8px;padding:22px;cursor:pointer;transition:all .25s;position:relative;overflow:hidden}
.rt-card:hover{border-color:rgba(245,197,24,.35);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.rt-card.selected{border-color:var(--eec-gold);background:rgba(245,197,24,.06)}
.rt-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--eec-line)}
.rt-card.selected::before{background:var(--eec-gold)}
.rt-icon{width:46px;height:46px;border-radius:10px;display:grid;place-items:center;margin-bottom:14px}
.rt-card h4{font-family:var(--serif);font-size:18px;font-weight:500;margin:0 0 6px;color:white}
.rt-card p{font-size:12.5px;color:var(--eec-text-mute);line-height:1.5;margin:0 0 14px}
.rt-card .formats{display:flex;gap:5px;flex-wrap:wrap}
.rt-format{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;padding:3px 8px;border-radius:4px;background:rgba(255,255,255,.05);color:var(--eec-text-mute);border:1px solid var(--eec-line)}

.gen-panel{background:linear-gradient(180deg,#0F1F16,#0A1610);border:1px solid var(--eec-line);border-radius:8px;padding:28px;margin-bottom:32px}
.gen-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:14px;margin-bottom:22px}
.gen-field{display:flex;flex-direction:column;gap:6px}
.gen-field label{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--eec-gold);font-weight:500}
.gen-field select,.gen-field input{background:rgba(255,255,255,.03);border:1px solid var(--eec-line);border-radius:6px;padding:10px 14px;color:var(--eec-text);font:13px var(--sans);outline:none;transition:border .2s}
.gen-field select:focus,.gen-field input:focus{border-color:var(--eec-gold)}

.progress-overlay{position:fixed;inset:0;background:rgba(8,17,11,.85);backdrop-filter:blur(12px);z-index:200;display:flex;align-items:center;justify-content:center}
.progress-box{background:linear-gradient(180deg,#0F1F16,#08110B);border:1px solid var(--eec-line);border-radius:12px;padding:40px 48px;width:480px;text-align:center;animation:slideUp .4s cubic-bezier(.2,.7,.3,1)}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.progress-ring{width:80px;height:80px;margin:0 auto 24px;position:relative}
.progress-ring svg{transform:rotate(-90deg)}
.prog-track{fill:none;stroke:rgba(245,197,24,.1);stroke-width:6}
.prog-fill{fill:none;stroke:var(--eec-gold);stroke-width:6;stroke-linecap:round;transition:stroke-dasharray .4s}
.progress-ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:22px;font-weight:300;color:white}

.hist-row{display:grid;grid-template-columns:auto 1fr auto auto auto;gap:20px;padding:16px 24px;border-bottom:1px solid rgba(245,197,24,.05);align-items:center;cursor:pointer;transition:background .15s}
.hist-row:hover{background:rgba(245,197,24,.03)}
.hist-row:last-child{border-bottom:0}
.hist-icon{width:38px;height:38px;border-radius:8px;display:grid;place-items:center}
.hist-name{font-weight:500;color:white;font-size:13.5px;margin-bottom:3px}
.hist-meta{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--eec-text-mute)}
.hist-size{font-family:var(--mono);font-size:11px;color:var(--eec-text-mute)}
.hist-date{font-family:var(--mono);font-size:11px;color:var(--eec-text-mute);text-align:right;white-space:nowrap}
</style>
</head>
<body>
<div id="root"></div>
<script src="SCRIPTS/data.js"></script>
<script type="text/babel" src="COMPONENTS/dash-core.jsx"></script>
<script type="text/babel">
const { useState, useEffect, useRef } = React;
const { Sidebar, Topbar } = window.DashboardCore;

const REPORT_TYPES = [
  {
    id:'synodal', icon:<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7"><path d="M3 9l9-7 9 7v11H5z"/></svg>,
    title:'Rapport synodal', desc:'Vue nationale — toutes régions, tous districts, tous ouvriers.',
    formats:['PDF','XLSX','CSV'], color:'var(--eec-gold)', iconBg:'rgba(245,197,24,.12)',
  },
  {
    id:'regional', icon:<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>,
    title:'Rapport régional', desc:'Données d\'une région synodale — paroisses, ouvriers, œuvres, couverture GPS.',
    formats:['PDF','XLSX'], color:'#2D9E55', iconBg:'rgba(45,158,85,.15)',
  },
  {
    id:'ouvriers', icon:<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5"/><circle cx="17" cy="9" r="2"/><path d="M15 20c0-2 2-4 4-4s2 2 2 4"/></svg>,
    title:'Annuaire des ouvriers', desc:'Liste complète des pasteurs, diacres et catéchistes actifs.',
    formats:['PDF','XLSX','CSV'], color:'#6FCB95', iconBg:'rgba(63,179,106,.12)',
  },
  {
    id:'oeuvres', icon:<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7"><path d="M3 22V8l9-6 9 6v14M9 22V16h6v6"/></svg>,
    title:'Inventaire des œuvres', desc:'Écoles, centres médicaux, universités, terrains — par type et région.',
    formats:['PDF','CSV'], color:'#E0A914', iconBg:'rgba(224,169,20,.12)',
  },
  {
    id:'gps', icon:<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>,
    title:'Rapport GPS / SIG', desc:'Statut de géolocalisation, coordonnées manquantes, cartographie.',
    formats:['PDF','GeoJSON','KML'], color:'#54B97D', iconBg:'rgba(84,185,125,.12)',
  },
  {
    id:'audit', icon:<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7"><path d="M14 3H6v18h12V7l-4-4zM14 3v4h4M8 12h8M8 16h8"/></svg>,
    title:'Journal d\'audit', desc:'Historique complet des modifications, créations et suppressions.',
    formats:['PDF','CSV'], color:'rgba(245,197,24,.7)', iconBg:'rgba(245,197,24,.08)',
  },
];

const HISTORY = [
  {id:1,type:'synodal',name:'Rapport synodal T1 2026',date:'12 mai 2026',size:'3.2 MB',format:'PDF',author:'Pasteur ATABA Joël',pages:88},
  {id:2,type:'regional',name:'Rapport régional MIFI — Avr. 2026',date:'30 avr. 2026',size:'1.8 MB',format:'PDF',author:'Pasteur TIENTCHEU Félix',pages:42},
  {id:3,type:'ouvriers',name:'Annuaire ouvriers 2026',date:'15 avr. 2026',size:'890 KB',format:'XLSX',author:'Mme. KAMENI Esther',pages:null},
  {id:4,type:'gps',name:'Rapport GPS national — Mars 2026',date:'31 mars 2026',size:'2.1 MB',format:'PDF',author:'Pasteur Dr. NGAH Émile',pages:24},
  {id:5,type:'synodal',name:'Rapport synodal T4 2025',date:'5 janv. 2026',size:'3.0 MB',format:'PDF',author:'Pasteur ATABA Joël',pages:84},
  {id:6,type:'oeuvres',name:'Inventaire œuvres sociales 2025',date:'20 déc. 2025',size:'1.4 MB',format:'PDF',author:'Pasteur MBOUNA André',pages:56},
];

const TYPE_COLORS = {synodal:'var(--eec-gold)',regional:'#2D9E55',ouvriers:'#6FCB95',oeuvres:'#E0A914',gps:'#54B97D',audit:'rgba(245,197,24,.7)'};
const TYPE_ICONS = {synodal:'R',regional:'R',ouvriers:'O',oeuvres:'Œ',gps:'GPS',audit:'A'};

function ProgressModal({ type, pct, onDone }) {
  const circ = 2*Math.PI*34;
  const dash = (pct/100)*circ;
  const steps = ['Collecte des données...','Compilation des régions...','Génération du PDF...','Finalisation...'];
  const step = Math.min(3, Math.floor(pct/26));
  return (
    <div className="progress-overlay">
      <div className="progress-box">
        <div className="progress-ring">
          <svg viewBox="0 0 80 80" width="80" height="80">
            <circle className="prog-track" cx="40" cy="40" r="34"/>
            <circle className="prog-fill" cx="40" cy="40" r="34" strokeDasharray={`${dash} ${circ}`}/>
          </svg>
          <div className="pct">{pct}%</div>
        </div>
        <div style={{fontFamily:'var(--serif)',fontSize:'22px',fontWeight:400,color:'white',marginBottom:10}}>
          Génération en cours…
        </div>
        <div style={{fontFamily:'var(--mono)',fontSize:'11.5px',color:'var(--eec-gold)',letterSpacing:'.14em',marginBottom:24}}>{steps[step]}</div>
        <div style={{height:4,background:'rgba(255,255,255,.06)',borderRadius:2,overflow:'hidden'}}>
          <div style={{height:'100%',width:pct+'%',background:'linear-gradient(90deg,var(--eec-light),var(--eec-gold))',borderRadius:2,transition:'width .4s'}}/>
        </div>
        {pct>=100 && (
          <button className="btn btn-gold" style={{marginTop:24,width:'100%',justifyContent:'center'}} onClick={onDone}>
            ✓ Télécharger le rapport
          </button>
        )}
      </div>
    </div>
  );
}

function RapportsApp() {
  const [selected, setSelected] = useState('synodal');
  const [format, setFormat] = useState('PDF');
  const [region, setRegion] = useState('');
  const [periode, setPeriode] = useState('T1 2026');
  const [generating, setGenerating] = useState(false);
  const [progress, setProgress] = useState(0);
  const data = window.EEC_DATA;
  const selType = REPORT_TYPES.find(r=>r.id===selected);

  const generate = () => {
    setGenerating(true);
    setProgress(0);
    let p = 0;
    const iv = setInterval(()=>{
      p += Math.floor(Math.random()*12)+4;
      if(p >= 100) { p = 100; clearInterval(iv); }
      setProgress(p);
    }, 280);
  };

  return (
    <div className="app-shell">
      <Sidebar/>
      <main className="main">
        <Topbar/>
        <div className="content">
          <div className="page-head">
            <div>
              <div style={{fontFamily:'var(--mono)',fontSize:'11px',letterSpacing:'.2em',color:'var(--eec-gold)'}}>— ADMINISTRATION / RAPPORTS</div>
              <h1 style={{fontFamily:'var(--serif)',fontWeight:400,fontSize:'clamp(28px,3.5vw,42px)',letterSpacing:'-.02em',margin:'6px 0 6px'}}>Rapports & <em style={{color:'var(--eec-gold)',fontStyle:'italic',fontWeight:300}}>exports.</em></h1>
              <div className="sub">Générez et téléchargez les rapports synodaux, régionaux et thématiques.</div>
            </div>
            <div className="actions">
              <a href="dashboard.html" className="btn btn-ghost">← Tableau de bord</a>
            </div>
          </div>

          {/* Type selector */}
          <div style={{fontFamily:'var(--mono)',fontSize:'10.5px',letterSpacing:'.2em',textTransform:'uppercase',color:'var(--eec-gold)',marginBottom:14}}>— Type de rapport</div>
          <div className="report-type-grid">
            {REPORT_TYPES.map(rt=>(
              <div key={rt.id} className={`rt-card ${selected===rt.id?'selected':''}`} onClick={()=>{setSelected(rt.id);setFormat(rt.formats[0]);}}>
                <div className="rt-icon" style={{background:rt.iconBg,color:rt.color}}>{rt.icon}</div>
                <h4>{rt.title}</h4>
                <p>{rt.desc}</p>
                <div className="formats">{rt.formats.map(f=><span key={f} className="rt-format" style={format===f&&selected===rt.id?{background:'rgba(245,197,24,.12)',color:'var(--eec-gold)',borderColor:'rgba(245,197,24,.3)'}:{}}>{f}</span>)}</div>
              </div>
            ))}
          </div>

          {/* Generation panel */}
          <div className="gen-panel">
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:22}}>
              <div>
                <div style={{fontFamily:'var(--mono)',fontSize:'10.5px',letterSpacing:'.2em',textTransform:'uppercase',color:'var(--eec-gold)',marginBottom:6}}>— Configuration du rapport</div>
                <div style={{fontFamily:'var(--serif)',fontSize:'22px',fontWeight:400,color:'white'}}>{selType?.title}</div>
              </div>
              <div style={{display:'flex',gap:8}}>
                {selType?.formats.map(f=>(
                  <button key={f} className={`filter-chip ${format===f?'active':''}`} onClick={()=>setFormat(f)}>{f}</button>
                ))}
              </div>
            </div>
            <div className="gen-grid">
              <div className="gen-field">
                <label>Période</label>
                <select value={periode} onChange={e=>setPeriode(e.target.value)}>
                  <option>T1 2026</option><option>T4 2025</option><option>T3 2025</option>
                  <option>Année 2025</option><option>Année 2024</option><option>Personnalisée</option>
                </select>
              </div>
              {(selected==='regional'||selected==='gps') && (
                <div className="gen-field">
                  <label>Région</label>
                  <select value={region} onChange={e=>setRegion(e.target.value)}>
                    <option value="">Toutes les régions</option>
                    {data.regions.map(r=><option key={r.code} value={r.code}>{r.name}</option>)}
                  </select>
                </div>
              )}
              <div className="gen-field">
                <label>Langue</label>
                <select><option>Français</option><option>Anglais</option></select>
              </div>
              <div className="gen-field">
                <label>Niveau de détail</label>
                <select><option>Complet</option><option>Résumé exécutif</option><option>Données brutes</option></select>
              </div>
            </div>
            <div style={{display:'flex',gap:12,alignItems:'center'}}>
              <button className="btn btn-gold" style={{padding:'12px 28px',fontSize:14}} onClick={generate}>
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
                Générer le rapport {format}
              </button>
              <button className="btn btn-ghost" style={{fontSize:13}}>Aperçu rapide</button>
              <span style={{fontFamily:'var(--mono)',fontSize:'10.5px',color:'var(--eec-text-mute)',letterSpacing:'.1em',marginLeft:'auto'}}>
                ESTIMATION : ~{selected==='synodal'?'88':selected==='regional'?'40':'24'} PAGES · {format==='XLSX'?'800 KB':'2.4 MB'}
              </span>
            </div>
          </div>

          {/* History */}
          <div className="card">
            <div className="card-head">
              <h3>Historique des rapports</h3>
              <span style={{fontFamily:'var(--mono)',fontSize:'11px',letterSpacing:'.1em',color:'var(--eec-gold)'}}>{HISTORY.length} RAPPORTS</span>
            </div>
            {HISTORY.map(h=>(
              <div className="hist-row" key={h.id}>
                <div className="hist-icon" style={{background:'rgba(245,197,24,.08)',color:TYPE_COLORS[h.type]||'var(--eec-gold)'}}>
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M14 3H6v18h12V7l-4-4zM14 3v4h4"/></svg>
                </div>
                <div>
                  <div className="hist-name">{h.name}</div>
                  <div className="hist-meta">{h.author} · {h.pages ? h.pages+' pages · ' : ''}{h.format}</div>
                </div>
                <span style={{fontFamily:'var(--mono)',fontSize:'10.5px',padding:'3px 9px',borderRadius:4,background:'rgba(255,255,255,.04)',color:'var(--eec-text-mute)',border:'1px solid var(--eec-line)'}}>{h.format}</span>
                <div className="hist-size">{h.size}</div>
                <div className="hist-date">
                  {h.date}
                  <div style={{display:'flex',gap:6,marginTop:6,justifyContent:'flex-end'}}>
                    <button style={{fontFamily:'var(--mono)',fontSize:'10px',letterSpacing:'.1em',color:'var(--eec-gold)',background:'transparent',border:'1px solid rgba(245,197,24,.25)',borderRadius:4,padding:'3px 9px',cursor:'pointer',textDecoration:'none'}}>↓ PDF</button>
                    <button style={{fontFamily:'var(--mono)',fontSize:'10px',letterSpacing:'.1em',color:'var(--eec-text-mute)',background:'transparent',border:'1px solid var(--eec-line)',borderRadius:4,padding:'3px 9px',cursor:'pointer'}}>Partager</button>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      </main>
      {generating && <ProgressModal type={selected} pct={progress} onDone={()=>setGenerating(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<RapportsApp/>);
</script>
</body>
</html>
