<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>EEC · Gestion des paroisses</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Inter:wght@300;400;450;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="STYLESHEETS/styles.css"/>
<link rel="stylesheet" href="STYLESHEETS/dashboard.css"/>
<link rel="stylesheet" href="STYLESHEETS/comptes-sig.css"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
.view-toggle{display:flex;gap:2px;background:rgba(255,255,255,0.03);border:1px solid var(--eec-line);border-radius:6px;padding:3px}
.view-toggle button{width:30px;height:30px;display:grid;place-items:center;border:0;background:transparent;color:var(--eec-text-mute);border-radius:4px;cursor:pointer;transition:all .15s}
.view-toggle button.on{background:var(--eec-gold);color:var(--eec-green-deep)}
.parish-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;padding:0}
.pg-card{background:linear-gradient(180deg,#0F1F16,#0A1610);border:1px solid var(--eec-line);border-radius:8px;overflow:hidden;cursor:pointer;transition:all .25s cubic-bezier(.2,.7,.3,1)}
.pg-card:hover{border-color:rgba(245,197,24,.35);transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,.3)}
.pg-thumb{height:120px;position:relative;overflow:hidden}
.pg-thumb img{width:100%;height:100%;object-fit:cover;filter:brightness(.45) saturate(.85) hue-rotate(50deg);transition:transform .5s}
.pg-card:hover .pg-thumb img{transform:scale(1.06)}
.pg-thumb::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(10,22,16,.95))}
.pg-thumb-badge{position:absolute;top:10px;left:12px;z-index:2}
.pg-body{padding:16px 18px 18px}
.pg-region{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--eec-gold);margin-bottom:6px}
.pg-name{font-family:var(--serif);font-size:17px;font-weight:500;color:white;line-height:1.2;margin-bottom:10px}
.pg-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;border-top:1px solid rgba(245,197,24,.08);padding-top:12px}
.pg-stat .v{font-family:var(--serif);font-size:22px;font-weight:300;color:white}
.pg-stat .l{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--eec-text-mute);margin-top:2px}
.pg-actions{display:flex;gap:6px;margin-top:12px}
.pg-btn{flex:1;padding:8px;text-align:center;border-radius:6px;font:500 12px var(--sans);cursor:pointer;transition:all .15s;text-decoration:none;border:1px solid var(--eec-line);background:transparent;color:var(--eec-text-mute)}
.pg-btn:hover{border-color:rgba(245,197,24,.3);color:var(--eec-gold)}
.pg-btn.primary{background:var(--eec-gold);color:var(--eec-green-deep);border-color:var(--eec-gold);font-weight:600}
.pg-btn.primary:hover{background:#FFD93D}

/* Drawer paroisse */
.p-drawer{position:fixed;top:0;right:0;bottom:0;width:600px;max-width:100vw;background:linear-gradient(180deg,#0F1F16,#08110B);border-left:1px solid var(--eec-line);z-index:100;transform:translateX(100%);transition:transform .4s cubic-bezier(.2,.7,.3,1);display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.5)}
.p-drawer.open{transform:translateX(0)}
.p-drawer-backdrop{position:fixed;inset:0;background:rgba(8,17,11,.6);backdrop-filter:blur(4px);z-index:99;opacity:0;pointer-events:none;transition:opacity .3s}
.p-drawer-backdrop.open{opacity:1;pointer-events:auto}
.p-dh{position:relative;height:180px;overflow:hidden;flex-shrink:0}
.p-dh img{width:100%;height:100%;object-fit:cover;filter:brightness(.4) saturate(.85) hue-rotate(50deg)}
.p-dh::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,17,11,.2),rgba(8,17,11,.95))}
.p-dh-content{position:absolute;bottom:20px;left:28px;right:60px;z-index:2}
.p-dh-close{position:absolute;top:14px;right:14px;z-index:3;width:32px;height:32px;border-radius:50%;background:rgba(8,17,11,.6);border:1px solid var(--eec-line);color:white;font-size:16px;cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(8px)}
.p-db{flex:1;overflow-y:auto;padding:24px 28px}
.p-db::-webkit-scrollbar{width:6px}
.p-db::-webkit-scrollbar-thumb{background:rgba(245,197,24,.15);border-radius:3px}
.p-df{padding:18px 28px;border-top:1px solid var(--eec-line);display:flex;gap:10px;background:#08110B}

/* Stats in drawer */
.d-kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--eec-line);border:1px solid var(--eec-line);border-radius:8px;overflow:hidden;margin-bottom:22px}
.d-kpi{background:linear-gradient(180deg,#0F1F16,#0A1610);padding:14px 16px}
.d-kpi .v{font-family:var(--serif);font-size:28px;font-weight:300;color:white;letter-spacing:-.02em}
.d-kpi .l{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--eec-text-mute);margin-top:4px}

/* Identity rows in drawer */
.d-row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid rgba(245,197,24,.05);font-size:13.5px;align-items:center}
.d-row:last-child{border-bottom:0}
.d-row .dk{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--eec-text-mute)}
.d-row .dv{color:white;font-weight:500;text-align:right;max-width:60%}

/* Completion bar */
.completion-bar{height:8px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden;margin:8px 0}
.completion-bar span{display:block;height:100%;background:linear-gradient(90deg,var(--eec-light),var(--eec-gold));border-radius:4px;transition:width .8s}
</style>
</head>
<body>
<div id="root"></div>
<script src="SCRIPTS/data.js"></script>
<script type="text/babel" src="COMPONENTS/dash-core.jsx"></script>
<script type="text/babel">
const { useState, useMemo, useEffect } = React;
const { Sidebar, Topbar, Logo, I } = window.DashboardCore;
const data = window.EEC_DATA;

// Generate parishes list
let _seed = 42;
const rng = () => { _seed = (_seed * 1664525 + 1013904223) & 0xffffffff; return Math.abs(_seed) / 0x7fffffff; };
const IMGS = ['assets/church.png','assets/crucifix.jpg','assets/bible.png'];
const PARISHES_DATA = [];
let _id = 1;
data.regions.forEach(r => {
  for (let i = 0; i < r.count; i++) {
    const fideles = 200 + Math.floor(rng() * 2200);
    const completionScore = 40 + Math.floor(rng() * 60);
    PARISHES_DATA.push({
      id: _id++,
      name: `Paroisse EEC ${r.name.split('-')[0]} ${i + 1}`,
      region: r.name, regionCode: r.code, color: r.color,
      district: `District ${i % 5 + 1}`,
      niveau: i === 0 ? 'Bureau Régional' : i < 3 ? 'Bureau de District' : 'Paroisse',
      fideles, ouvriers: Math.max(2, Math.floor(fideles / 100)),
      oeuvres: ['École','Centre médical','Terrain','Université'].filter(() => rng() > 0.6),
      founded: 1940 + Math.floor(rng() * 60),
      gps: `${(4.5 + rng() * 4.5).toFixed(4)}°N, ${(9 + rng() * 5).toFixed(4)}°E`,
      pasteur: `Pasteur ${['WAMBA','NGOUFFO','TCHOUMI','FOWE','NJOYA','MBOUNA','FOUDA'][Math.floor(rng()*7)]} ${String.fromCharCode(65+Math.floor(rng()*20))}.`,
      img: IMGS[_id % 3],
      completion: completionScore,
      statut: completionScore > 80 ? 'Complet' : completionScore > 55 ? 'En cours' : 'Incomplet',
      hasGPS: rng() > 0.25,
    });
  }
});

const NIVEAUX = ['Tous', 'Bureau Régional', 'Bureau de District', 'Paroisse'];
const STATUTS = ['Tous', 'Complet', 'En cours', 'Incomplet'];

function ParishDrawer({ parish, onClose }) {
  if (!parish) return null;
  return (
    <>
      <div className={`p-drawer-backdrop open`} onClick={onClose}/>
      <aside className="p-drawer open">
        <div className="p-dh">
          <img src={parish.img} alt=""/>
          <button className="p-dh-close" onClick={onClose}>×</button>
          <div className="p-dh-content">
            <div style={{fontFamily:'var(--mono)',fontSize:'10px',letterSpacing:'.2em',color:'var(--eec-gold)',marginBottom:6,textTransform:'uppercase'}}>{parish.region} · {parish.niveau}</div>
            <div style={{fontFamily:'var(--serif)',fontSize:'24px',fontWeight:400,color:'white',lineHeight:1.1}}>{parish.name}</div>
          </div>
        </div>
        <div className="p-db">
          {/* KPIs */}
          <div className="d-kpi-row">
            <div className="d-kpi"><div className="v">{parish.fideles.toLocaleString('fr-FR')}</div><div className="l">Fidèles</div></div>
            <div className="d-kpi"><div className="v">{parish.ouvriers}</div><div className="l">Ouvriers</div></div>
            <div className="d-kpi"><div className="v">{parish.oeuvres.length}</div><div className="l">Œuvres</div></div>
          </div>

          {/* Completion */}
          <div style={{marginBottom:22}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
              <span style={{fontFamily:'var(--mono)',fontSize:'10.5px',letterSpacing:'.18em',textTransform:'uppercase',color:'var(--eec-gold)'}}>Complétude du profil</span>
              <span style={{fontFamily:'var(--serif)',fontSize:'22px',color:'white',fontWeight:300}}>{parish.completion}%</span>
            </div>
            <div className="completion-bar"><span style={{width:parish.completion+'%'}}/></div>
            <div style={{display:'flex',gap:12,marginTop:10,flexWrap:'wrap'}}>
              {[
                {l:'GPS',ok:parish.hasGPS},{l:'Photos',ok:parish.completion>50},{l:'Ouvriers',ok:parish.ouvriers>3},{l:'Œuvres',ok:parish.oeuvres.length>0},{l:'Pasteur',ok:true},
              ].map(it=>(
                <span key={it.l} style={{display:'inline-flex',alignItems:'center',gap:5,fontFamily:'var(--mono)',fontSize:'10px',letterSpacing:'.12em',color:it.ok?'#6FCB95':'rgba(240,244,241,0.4)',textTransform:'uppercase'}}>
                  <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><path d={it.ok?"M5 12l5 5 9-9":"M18 6 6 18M6 6l12 12"}/></svg>
                  {it.l}
                </span>
              ))}
            </div>
          </div>

          {/* Identity */}
          <div style={{fontFamily:'var(--mono)',fontSize:'10.5px',letterSpacing:'.2em',textTransform:'uppercase',color:'var(--eec-gold)',marginBottom:12}}>Identité</div>
          {[
            ['Code','EEC-'+parish.regionCode+'-'+String(parish.id).padStart(3,'0')],
            ['Pasteur',parish.pasteur],
            ['District',parish.district],
            ['Fondée en',parish.founded],
            ['GPS',parish.hasGPS ? parish.gps : '— Non géolocalisée'],
          ].map(([k,v])=>(
            <div className="d-row" key={k}><span className="dk">{k}</span><span className="dv" style={k==='GPS'&&!parish.hasGPS?{color:'var(--eec-text-mute)'}:{}}>{v}</span></div>
          ))}

          {/* Oeuvres */}
          {parish.oeuvres.length > 0 && (
            <div style={{marginTop:20}}>
              <div style={{fontFamily:'var(--mono)',fontSize:'10.5px',letterSpacing:'.2em',textTransform:'uppercase',color:'var(--eec-gold)',marginBottom:12}}>Œuvres sociales</div>
              <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                {parish.oeuvres.map(o=>(
                  <span key={o} style={{padding:'6px 14px',borderRadius:999,background:'rgba(45,158,85,.12)',color:'#6FCB95',border:'1px solid rgba(45,158,85,.25)',fontSize:'12.5px',fontWeight:500}}>{o}</span>
                ))}
              </div>
            </div>
          )}
        </div>
        <div className="p-df">
          <a href="paroisse.html" className="btn btn-gold" style={{flex:1,justifyContent:'center',fontSize:13}}>Voir la fiche complète →</a>
          <button className="btn btn-ghost" style={{fontSize:13}} onClick={onClose}>Fermer</button>
          <button className="btn" style={{background:'rgba(232,80,60,.12)',color:'#E8856B',border:'1px solid rgba(232,80,60,.3)',fontSize:13}}>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
          </button>
        </div>
      </aside>
    </>
  );
}

function ParoissesApp() {
  const [view, setView] = useState('table');
  const [search, setSearch] = useState('');
  const [regionF, setRegionF] = useState('');
  const [niveauF, setNiveauF] = useState('Tous');
  const [statutF, setStatutF] = useState('Tous');
  const [selected, setSelected] = useState(null);
  const [page, setPage] = useState(0);
  const PER_PAGE = 15;

  const filtered = useMemo(() => PARISHES_DATA.filter(p => {
    if (search && !p.name.toLowerCase().includes(search.toLowerCase()) && !p.region.toLowerCase().includes(search.toLowerCase())) return false;
    if (regionF && p.regionCode !== regionF) return false;
    if (niveauF !== 'Tous' && p.niveau !== niveauF) return false;
    if (statutF !== 'Tous' && p.statut !== statutF) return false;
    return true;
  }), [search, regionF, niveauF, statutF]);

  const paged = filtered.slice(page * PER_PAGE, (page + 1) * PER_PAGE);
  const totalPages = Math.ceil(filtered.length / PER_PAGE);

  return (
    <div className="app-shell">
      <Sidebar/>
      <main className="main">
        <Topbar/>
        <div className="content">
          <div className="page-head">
            <div>
              <div style={{fontFamily:'var(--mono)',fontSize:'11px',letterSpacing:'.2em',color:'var(--eec-gold)'}}>— RÉSEAU / PAROISSES</div>
              <h1 style={{fontFamily:'var(--serif)',fontWeight:400,fontSize:'clamp(28px,3.5vw,42px)',letterSpacing:'-.02em',margin:'6px 0 6px'}}>Toutes les <em style={{color:'var(--eec-gold)',fontStyle:'italic',fontWeight:300}}>paroisses.</em></h1>
              <div className="sub">{PARISHES_DATA.length} paroisses · 22 régions · {filtered.length} résultats affichés</div>
            </div>
            <div className="actions">
              <a href="dashboard.html" className="btn btn-ghost">← Tableau de bord</a>
              <a href="carte.html" className="btn btn-ghost">Voir carte</a>
              <button className="btn btn-gold">+ Nouvelle paroisse</button>
            </div>
          </div>

          {/* Toolbar */}
          <div style={{display:'flex',gap:12,marginBottom:20,flexWrap:'wrap',alignItems:'center'}}>
            <div className="comptes-toolbar" style={{flex:1,margin:0,gap:10}}>
              <div className="search" style={{maxWidth:360}}>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3-3"/></svg>
                <input placeholder="Nom, région, district..." value={search} onChange={e=>{setSearch(e.target.value);setPage(0);}}/>
              </div>
              <select value={regionF} onChange={e=>{setRegionF(e.target.value);setPage(0);}} style={{background:'rgba(255,255,255,.03)',border:'1px solid var(--eec-line)',borderRadius:6,color:'var(--eec-text)',padding:'9px 14px',font:'13px var(--sans)',outline:'none',cursor:'pointer'}}>
                <option value="">Toutes les régions</option>
                {data.regions.map(r=><option key={r.code} value={r.code}>{r.name}</option>)}
              </select>
              {[NIVEAUX,STATUTS].map((opts,gi)=>(
                <div key={gi} style={{display:'flex',gap:4}}>
                  {opts.map(o=>(
                    <button key={o} className={`filter-chip ${(gi===0?niveauF:statutF)===o?'active':''}`}
                            onClick={()=>{gi===0?setNiveauF(o):setStatutF(o);setPage(0);}}>
                      {o}
                    </button>
                  ))}
                </div>
              ))}
            </div>
            <div className="view-toggle">
              <button className={view==='table'?'on':''} onClick={()=>setView('table')}>
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 5h18M3 10h18M3 15h18M3 20h18"/></svg>
              </button>
              <button className={view==='grid'?'on':''} onClick={()=>setView('grid')}>
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
              </button>
            </div>
          </div>

          {/* TABLE VIEW */}
          {view === 'table' && (
            <div className="card">
              <div className="table-wrap">
                <table className="tbl">
                  <thead>
                    <tr>
                      <th>Paroisse</th><th>Région</th><th>Niveau</th><th>Fidèles</th><th>Ouvriers</th><th>GPS</th><th>Complétude</th><th>Statut</th><th></th>
                    </tr>
                  </thead>
                  <tbody>
                    {paged.map(p=>(
                      <tr key={p.id} style={{cursor:'pointer'}} onClick={()=>setSelected(p)}>
                        <td>
                          <div className="cell-name">
                            <span className="dot" style={{background:p.color,color:p.color,boxShadow:`0 0 8px ${p.color}`}}></span>
                            <div><b>{p.name}</b><small>{p.district}</small></div>
                          </div>
                        </td>
                        <td><span style={{fontFamily:'var(--mono)',fontSize:'11px',color:'var(--eec-text-mute)',letterSpacing:'.1em'}}>{p.region}</span></td>
                        <td>
                          <span className={`tag ${p.niveau==='Bureau Régional'?'gold':p.niveau==='Bureau de District'?'green':'gray'}`}>
                            {p.niveau==='Bureau Régional'?'Régional':p.niveau==='Bureau de District'?'District':'Paroisse'}
                          </span>
                        </td>
                        <td><span style={{fontFamily:'var(--serif)',fontSize:'19px',fontWeight:400}}>{p.fideles.toLocaleString('fr-FR')}</span></td>
                        <td><span style={{fontFamily:'var(--mono)',fontSize:'12px',color:'white'}}>{p.ouvriers}</span></td>
                        <td>
                          {p.hasGPS
                            ? <span style={{color:'#6FCB95',fontFamily:'var(--mono)',fontSize:'10.5px',letterSpacing:'.1em'}}>✓ OUI</span>
                            : <span style={{color:'rgba(240,244,241,.4)',fontFamily:'var(--mono)',fontSize:'10.5px',letterSpacing:'.1em'}}>— NON</span>}
                        </td>
                        <td>
                          <div style={{display:'flex',alignItems:'center',gap:10}}>
                            <div className="bar" style={{width:70}}><span style={{width:p.completion+'%'}}/></div>
                            <span style={{fontFamily:'var(--mono)',fontSize:'10.5px',color:'var(--eec-text-mute)',minWidth:28}}>{p.completion}%</span>
                          </div>
                        </td>
                        <td>
                          <span className={`tag ${p.statut==='Complet'?'green':p.statut==='En cours'?'gold':'red'}`}>{p.statut}</span>
                        </td>
                        <td>
                          <div className="row-actions">
                            <button onClick={e=>{e.stopPropagation();setSelected(p)}} title="Voir">
                              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                            </button>
                            <button title="Modifier">
                              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M14 4l6 6L8 22H2v-6z"/></svg>
                            </button>
                          </div>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              {/* Pagination */}
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'14px 24px',borderTop:'1px solid var(--eec-line)',fontFamily:'var(--mono)',fontSize:'11px',color:'var(--eec-text-mute)',letterSpacing:'.1em'}}>
                <span>{filtered.length} RÉSULTATS · PAGE {page+1} / {totalPages||1}</span>
                <div style={{display:'flex',gap:6}}>
                  <button disabled={page===0} onClick={()=>setPage(p=>p-1)} style={{padding:'6px 14px',background:'transparent',border:'1px solid var(--eec-line)',borderRadius:6,color:page===0?'rgba(240,244,241,.25)':'var(--eec-text-mute)',cursor:page===0?'not-allowed':'pointer',font:'500 12px var(--sans)',transition:'all .15s'}}
                    onMouseEnter={e=>{if(page>0)e.target.style.borderColor='rgba(245,197,24,.4)'}}
                    onMouseLeave={e=>e.target.style.borderColor='var(--eec-line)'}>← Précédent</button>
                  <button disabled={page>=totalPages-1} onClick={()=>setPage(p=>p+1)} style={{padding:'6px 14px',background:'transparent',border:'1px solid var(--eec-line)',borderRadius:6,color:page>=totalPages-1?'rgba(240,244,241,.25)':'var(--eec-text-mute)',cursor:page>=totalPages-1?'not-allowed':'pointer',font:'500 12px var(--sans)',transition:'all .15s'}}
                    onMouseEnter={e=>{if(page<totalPages-1)e.target.style.borderColor='rgba(245,197,24,.4)'}}
                    onMouseLeave={e=>e.target.style.borderColor='var(--eec-line)'}>Suivant →</button>
                </div>
              </div>
            </div>
          )}

          {/* GRID VIEW */}
          {view === 'grid' && (
            <div className="parish-grid">
              {paged.map(p=>(
                <div className="pg-card" key={p.id} onClick={()=>setSelected(p)}>
                  <div className="pg-thumb">
                    <img src={p.img} alt=""/>
                    <div className="pg-thumb-badge">
                      <span className={`tag ${p.niveau==='Bureau Régional'?'gold':p.niveau==='Bureau de District'?'green':'gray'}`} style={{fontSize:'10px'}}>
                        {p.niveau==='Bureau Régional'?'Régional':p.niveau==='Bureau de District'?'District':'Paroisse'}
                      </span>
                    </div>
                  </div>
                  <div className="pg-body">
                    <div className="pg-region">{p.region}</div>
                    <div className="pg-name">{p.name}</div>
                    <div style={{height:4,background:'rgba(255,255,255,.06)',borderRadius:2,overflow:'hidden',marginBottom:12}}>
                      <div style={{height:'100%',width:p.completion+'%',background:`linear-gradient(90deg,${p.color},var(--eec-gold))`,borderRadius:2}}/>
                    </div>
                    <div className="pg-stats">
                      <div className="pg-stat"><div className="v">{p.fideles>999?Math.round(p.fideles/100)/10+'k':p.fideles}</div><div className="l">Fidèles</div></div>
                      <div className="pg-stat"><div className="v">{p.ouvriers}</div><div className="l">Ouvriers</div></div>
                      <div className="pg-stat"><div className="v">{p.oeuvres.length}</div><div className="l">Œuvres</div></div>
                    </div>
                    <div className="pg-actions">
                      <button className="pg-btn primary">Voir fiche</button>
                      <button className="pg-btn">Modifier</button>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      </main>
      <ParishDrawer parish={selected} onClose={()=>setSelected(null)}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ParoissesApp/>);
</script>
</body>
</html>
